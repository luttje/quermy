name: Release

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs so a moved or hijacked
# tag cannot change what runs here. Dependabot keeps the pins up to date.

# Nothing gets write access unless a job asks for it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the GitHub Release

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Don't leave the workflow token in .git/config where build scripts
        # and dependencies could read it.
        persist-credentials: false

    - name: Set up PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.3'
        tools: composer:v2

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Determine release name
      id: release_name
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "name=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        fi

    # The release name comes from the tag, which is user-controlled text. It
    # is passed through an environment variable rather than pasted into the
    # script, so a tag name can never be interpreted as shell commands.
    - name: Build and package releases
      env:
        RELEASE_NAME: ${{ steps.release_name.outputs.name }}
      run: bash tools/build-releases.sh "$RELEASE_NAME"

    - name: Generate checksums
      working-directory: dist
      run: |
        sha256sum *.zip > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Upload generic release artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: quermy-${{ steps.release_name.outputs.name }}
        path: dist/quermy-${{ steps.release_name.outputs.name }}.zip
        if-no-files-found: error

    - name: Upload Laragon release artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: quermy-laragon-${{ steps.release_name.outputs.name }}
        path: dist/quermy-laragon-${{ steps.release_name.outputs.name }}.zip
        if-no-files-found: error

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: |
          dist/quermy-${{ steps.release_name.outputs.name }}.zip
          dist/quermy-laragon-${{ steps.release_name.outputs.name }}.zip
          dist/SHA256SUMS.txt
