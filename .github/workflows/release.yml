name: Release

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer:v2

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Determine release name
      id: release_name
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "name=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and package releases
      run: bash tools/build-releases.sh "${{ steps.release_name.outputs.name }}"

    - name: Upload generic release artifact
      uses: actions/upload-artifact@v7
      with:
        name: quermy-${{ steps.release_name.outputs.name }}
        path: dist/quermy-${{ steps.release_name.outputs.name }}.zip
        if-no-files-found: error

    - name: Upload Laragon release artifact
      uses: actions/upload-artifact@v7
      with:
        name: quermy-laragon-${{ steps.release_name.outputs.name }}
        path: dist/quermy-laragon-${{ steps.release_name.outputs.name }}.zip
        if-no-files-found: error

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/quermy-${{ steps.release_name.outputs.name }}.zip
          dist/quermy-laragon-${{ steps.release_name.outputs.name }}.zip
