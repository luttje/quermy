name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, sockets
        tools: composer:v2
        coverage: none

    - name: Cache Composer packages
      uses: actions/cache@v5
      with:
        path: backend/vendor
        key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.json', 'backend/composer.lock') }}
        restore-keys: composer-${{ matrix.php }}-

    - name: Install dependencies
      working-directory: backend
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    # Our testingcontainers setup can be a bit flaky sometimes, so we retry the tests
    - name: Run tests
      uses: nick-fields/retry@v4
      with:
        timeout_seconds: 30
        max_attempts: 3
        command: cd backend && ./vendor/bin/pest --ci
