name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Third-party actions are pinned to full commit SHAs so a moved or hijacked
# tag cannot change what runs here. Dependabot keeps the pins up to date.

# Tests only need to read the code.
permissions:
  contents: read

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # Don't leave the workflow token in .git/config where build scripts
        # and dependencies could read it.
        persist-credentials: false

    - name: Set up PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ matrix.php }}
        extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, sockets
        tools: composer:v2
        coverage: none

    - name: Cache Composer packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: backend/vendor
        key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.json', 'backend/composer.lock') }}
        restore-keys: composer-${{ matrix.php }}-

    - name: Install dependencies
      working-directory: backend
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    # Our testingcontainers setup can be a bit flaky sometimes, so we retry the tests
    - name: Run tests
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 10
        max_attempts: 3
        command: cd backend && ./vendor/bin/pest --ci
