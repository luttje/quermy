<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />
    <!--
        Content Security Policy. Scripts may only come from our own origin, so
        injected markup cannot run code, and nothing may be fetched from or
        sent to third parties (except the Google Fonts below). It lives in a
        meta tag so it applies however the app is served (Apache, Nginx, php -S).
        'unsafe-inline' for styles is needed by CodeMirror and inline style
        attributes; it does not allow inline scripts.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Quermy</title>
    <meta name="theme-color"
          content="#0a0c0a" />
    <link rel="preconnect"
          href="https://fonts.googleapis.com" />
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet" />
    <link href="./src/app.css"
          rel="stylesheet">
    <link rel="icon"
          type="image/svg+xml"
          href="./icon.svg" />
</head>

<body>
    <div id="app"></div>
    <script type="module"
            src="/src/main.js"></script>
</body>

</html>
