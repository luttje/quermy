Alias /quermy "C:/laragon/etc/apps/quermy/public/"

# To give access from outside, replace:
#
#   Require local
#
# with:
#
#   Require all granted
#
# Before you do, read the hosting guide: anyone who can reach Quermy can use
# it to connect to the databases on this machine.
# https://github.com/luttje/quermy/blob/main/docs/hosting-publicly.md
#

<Directory "C:/laragon/etc/apps/quermy/public/">
  Options Indexes FollowSymLinks MultiViews
  AllowOverride all

  Require local

</Directory>
